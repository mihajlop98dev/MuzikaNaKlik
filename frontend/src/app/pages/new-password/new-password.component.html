<section class="section">
  <div class="wrap">
    <div class="auth-form" *ngIf="checking">
      <p class="muted">Proveravam link...</p>
    </div>

    <div class="auth-form" *ngIf="!checking && !ready && !done">
      <h2>Link ne važi</h2>
      <p class="error-text">{{ error }}</p>
      <a routerLink="/zaboravljena-lozinka" class="btn btn-gold auth-btn">Zatraži novi link</a>
    </div>

    <div class="auth-form" *ngIf="ready && !done">
      <h2>Nova lozinka</h2>
      <p class="muted">Upiši novu lozinku za svoj nalog.</p>

      <div class="form-group">
        <label>Nova lozinka</label>
        <input type="password" [(ngModel)]="password" class="form-input" placeholder="Minimalno 6 karaktera">
      </div>

      <div class="form-group">
        <label>Ponovi lozinku</label>
        <input type="password" [(ngModel)]="confirm" class="form-input" placeholder="********"
               (keyup.enter)="save()">
      </div>

      <p class="error-text" *ngIf="error">{{ error }}</p>

      <button class="btn btn-gold auth-btn" (click)="save()" [disabled]="saving">
        {{ saving ? 'Čuvanje...' : 'Sačuvaj lozinku' }}
      </button>
    </div>

    <div class="auth-form" *ngIf="done">
      <div style="text-align:center;padding:48px 0">
        <div style="font-size:64px;margin-bottom:16px">✅</div>
        <h2 style="margin-bottom:8px">Lozinka je promenjena</h2>
        <p class="muted" style="margin-bottom:24px">Sada se možeš prijaviti sa novom lozinkom.</p>
        <button class="btn btn-gold" (click)="goToLogin()">Idi na prijavu</button>
      </div>
    </div>
  </div>
</section>
