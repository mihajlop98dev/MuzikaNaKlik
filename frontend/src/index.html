<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8" />
  <title>Muzika na Klik — Pronađi idealnu muziku za svaku proslavu</title>
  <meta name="description" content="Pevači, bendovi i DJ-evi za svadbe, rođendane, krštenja, korporativne događaje. Pregledaj profile, pošalji upit i rezerviši izvođača za tvoju proslavu.">
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- SVG first: browsers that understand it prefer it and it stays sharp at
       any size. favicon.ico stays as the fallback for older browsers. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#0a0a0d" />
  <!-- Fonts are self-hosted (see @font-face in styles.css) so no visitor IP
       reaches a third party before any interaction. These two carry almost all
       visible text and are preloaded to avoid a flash of fallback type; the
       rest load on demand through unicode-range. -->
  <link rel="preload" href="/fonts/inter-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/sora-700-latin.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>

</body>
</html>
